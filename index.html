<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="KRMII's little corner of the internet — a personal journal.">
  <meta name="color-scheme" content="dark light">
  <title>KRMII — Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#entry">Skip to entry</a>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Journal navigation">
      <div class="brand">
        <a href="#" class="brand-name">✳ &nbsp; krmii's journal</a>
        <p>thoughts &amp; other things.</p>
      </div>
      <nav aria-label="Archive">
        <h2 class="sidebar-heading">Archive</h2>
        <div id="archive-tree"></div>
      </nav>
      <div class="sidebar-bottom">a little corner of the internet <span aria-hidden="true">✳</span></div>
    </aside>
    <div class="content-shell">
      <header class="topbar">
        <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Open archive">☰ <span>Archive</span></button>
        <span class="topbar-label">a living notebook</span>
        <button class="theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="false">☾</button>
      </header>
      <main id="entry" tabindex="-1">
        <article class="entry" aria-live="polite">
          <time class="entry-date" id="entry-date"></time>
          <h1 id="entry-title"></h1>
          <div class="entry-body" id="entry-body"></div>
          <nav class="entry-pager" aria-label="Other entries">
            <a id="older-link" href="#"></a>
            <a id="newer-link" href="#"></a>
          </nav>
        </article>
      </main>
      <footer class="footer">© KRMII · written whenever</footer>
    </div>
  </div>
  <div class="mobile-backdrop" id="mobile-backdrop" hidden></div>
  <script src="data/posts.js"></script>
  <script src="app.js"></script>
</body>
</html>
