<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="KRMII's personal journal — thoughts and other things.">
  <meta name="color-scheme" content="dark light">
  <title>KRMII — MySelf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Decorative sky chart: fixed behind the journal, never interactive. -->
  <svg class="sky-map" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="sky-fade">
        <stop offset="0" stop-color="white" stop-opacity="0.85"/>
        <stop offset="0.65" stop-color="white" stop-opacity="0.48"/>
        <stop offset="1" stop-color="white" stop-opacity="0"/>
      </radialGradient>
      <mask id="sky-mask"><rect width="1440" height="900" fill="url(#sky-fade)"/></mask>
    </defs>
    <g mask="url(#sky-mask)">
      <g class="sky-lines">
        <path d="M645 142 L755 101 L827 195 L967 157 L1064 238 L1180 201"/>
        <path d="M827 195 L862 312 L992 356 L1064 238"/>
        <path d="M1089 446 L1188 393 L1289 477 L1354 410"/>
        <path d="M1188 393 L1170 555 L1298 602 L1354 410"/>
        <path d="M679 587 L764 530 L864 631 L967 588 L1057 697"/>
        <path d="M764 530 L792 699 L875 761"/>
      </g>
      <g class="sky-stars">
        <circle cx="645" cy="142" r="2.3"/><circle cx="755" cy="101" r="3.1" class="twinkle t1"/>
        <circle cx="827" cy="195" r="2.8"/><circle cx="967" cy="157" r="2.5" class="twinkle t2"/>
        <circle cx="1064" cy="238" r="3"/><circle cx="1180" cy="201" r="2.1"/>
        <circle cx="862" cy="312" r="2"/><circle cx="992" cy="356" r="2.3" class="twinkle t3"/>
        <circle cx="1089" cy="446" r="2.4"/><circle cx="1188" cy="393" r="2.9" class="twinkle t4"/>
        <circle cx="1289" cy="477" r="2.4"/><circle cx="1354" cy="410" r="2.2"/>
        <circle cx="1170" cy="555" r="2.8"/><circle cx="1298" cy="602" r="2.1" class="twinkle t1"/>
        <circle cx="679" cy="587" r="2.2"/><circle cx="764" cy="530" r="3.1" class="twinkle t3"/>
        <circle cx="864" cy="631" r="2.1"/><circle cx="967" cy="588" r="2.8"/>
        <circle cx="1057" cy="697" r="2.4" class="twinkle t2"/><circle cx="792" cy="699" r="2.6"/>
        <circle cx="875" cy="761" r="2.3"/>
      </g>
      <g class="sky-dust">
        <circle cx="703" cy="260" r="1"/><circle cx="778" cy="397" r="1.2"/>
        <circle cx="924" cy="76" r="1.1"/><circle cx="1119" cy="119" r="1"/>
        <circle cx="1224" cy="297" r="1.1"/><circle cx="1312" cy="283" r="1.3"/>
        <circle cx="1037" cy="504" r="1"/><circle cx="1354" cy="683" r="1.2"/>
        <circle cx="1126" cy="752" r="1.1"/><circle cx="699" cy="760" r="1"/>
        <circle cx="948" cy="820" r="1.1"/><circle cx="613" cy="435" r="1"/>
      </g>
    </g>
  </svg>
  <a class="skip-link" href="#entry">Skip to entry</a>
  <div class="layout">
    <header class="site-header">
      <a href="#" class="site-brand" aria-label="Journal home"><span aria-hidden="true">✿</span> krmii / MySelf</a>
      <div class="header-actions">
        <button class="random-entry" type="button" title="Surprise me with a random entry" aria-label="Open a random journal entry">✧ <span>Surprise me</span></button>
        <button class="theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="false">☾</button>
      </div>
    </header>
    <aside class="sidebar" id="sidebar" aria-label="Journal navigation">
      <nav aria-label="Archive">
        <h2 class="sidebar-heading">Pages</h2>
        <div id="archive-tree"></div>
      </nav>
    </aside>
    <div class="content-shell">
      <header class="mobile-toolbar">
        <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Open archive">☰ <span>Pages</span></button>
      </header>
      <main id="entry" tabindex="-1">
        <article class="entry" aria-live="polite">
          <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb"></nav>
          <h1 id="entry-title"></h1>
          <div class="entry-info">
            <svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>
            <time class="entry-date" id="entry-date"></time>
          </div>
          <div class="entry-labels" id="entry-labels" aria-label="Entry labels" hidden></div>
          <div class="entry-body" id="entry-body"></div>
          <nav class="entry-pager" aria-label="Other entries">
            <a id="older-link" href="#"></a>
            <a id="newer-link" href="#"></a>
          </nav>
        </article>
      </main>
    </div>
  </div>
  <div class="mobile-backdrop" id="mobile-backdrop" hidden></div>
  <section class="music-widget" id="music-widget" aria-label="Journal soundtrack">
    <div class="music-reveal" id="music-reveal">
      <div class="music-panel" id="music-panel">
        <div class="music-heading">
          <strong><span aria-hidden="true">♫</span> soundtrack</strong>
          <div class="music-heading-actions">
            <a id="music-watch" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" hidden aria-label="Open current song on YouTube" title="View on YouTube">↗</a>
            <button class="music-close" id="music-close" type="button" aria-label="Minimize paused music player">−</button>
          </div>
        </div>
        <div class="music-video" id="music-video">
          <div id="youtube-player"></div>
        </div>
        <div class="music-controls">
          <button id="music-play" class="music-play" type="button" aria-label="Play soundtrack" title="Play soundtrack" disabled>
            <span class="music-play-icon" aria-hidden="true">▶</span>
          </button>
          <div class="music-volume">
            <label for="music-volume" aria-label="Volume">♫</label>
            <input id="music-volume" type="range" min="0" max="100" value="65" step="1" aria-label="Music volume">
            <output id="music-volume-value" for="music-volume">65%</output>
          </div>
        </div>
        <span id="music-status" class="music-status" role="status" aria-live="polite">Ready to listen</span>
      </div>
    </div>
    <button class="music-launch" id="music-launch" type="button" aria-controls="music-panel" aria-expanded="true" title="Minimize music widget">
      <span aria-hidden="true">♫</span>
      <span class="music-launch-label">Music</span>
      <span class="music-bars" id="music-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <span class="music-chevron" aria-hidden="true">⌄</span>
    </button>
  </section>
  <script src="data/posts.js"></script>
  <script src="app.js"></script>
  <script src="music-player.js"></script>
</body>
</html>
